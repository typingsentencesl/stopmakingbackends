name: AFTRBURNR · Windows

on:
  push:
    paths:
      - 'aftrburnr/**'
      - '.github/workflows/aftrburnr-windows.yml'
  pull_request:
    paths:
      - 'aftrburnr/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: aftrburnr

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build (release)
        run: flutter build windows --release

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: aftrburnr-windows-x64
          path: aftrburnr/build/windows/x64/runner/Release/
          if-no-files-found: error
